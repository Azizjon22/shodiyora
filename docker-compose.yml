services:
  postgres:
    image: postgres:16-alpine
    container_name: shodiyora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shodiyora
      POSTGRES_PASSWORD: shodiyora
      POSTGRES_DB: shodiyora
    ports:
      - "5436:5432"
    volumes:
      - shodiyora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodiyora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shodiyora_postgres_data:
